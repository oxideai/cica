name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cica-linux-x86_64
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cica-linux-x86_64-cloud
            features: "--features cloud"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: cica-linux-aarch64
            features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: cica-linux-aarch64-cloud
            features: "--features cloud"
          - os: macos-latest
            target: aarch64-apple-darwin
            name: cica-macos-aarch64
            features: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Prepare binary
        run: |
          cp target/${{ matrix.target }}/release/cica ${{ matrix.name }}
          strip ${{ matrix.name }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  upload:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              for file in "$dir"*; do
                if [ -f "$file" ]; then
                  cp "$file" release/
                fi
              done
            fi
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download cloud binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: cica-linux-x86_64-cloud
          path: .

      - name: Stage binary for the image context
        run: |
          mv cica-linux-x86_64-cloud cica-bin
          chmod +x cica-bin

      - name: Derive image tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push worker image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BIN_SOURCE=prebuilt
          push: true
          tags: |
            ghcr.io/oxiglade/cica-worker:${{ steps.ver.outputs.version }}
            ghcr.io/oxiglade/cica-worker:latest
